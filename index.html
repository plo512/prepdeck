<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Interview Prep Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Sticky header, scrolling content column (max 680px), fixed bottom tab bar. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e3e9e7; --line:#cfd8d5;
  --fg:#15211f; --muted:#56635f; --accent:#0d6e6e; --accent-ink:#ffffff; --accent-soft:#d5ebe9;
  --ok:#2c7a43; --warn:#b07408; --bad:#b8402a; --ok-soft:#dcefe1; --warn-soft:#f6e8c8; --bad-soft:#f5dcd5;
  --code-bg:#14201e; --code-fg:#dbe7e3;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --sunk:#1e2b29; --line:#2c3c39;
  --fg:#e3ece9; --muted:#97a8a3; --accent:#4fbcb6; --accent-ink:#06201f; --accent-soft:#16393a;
  --ok:#5cc27a; --warn:#e2a73a; --bad:#ef7b62; --ok-soft:#173523; --warn-soft:#3a2e12; --bad-soft:#3d1d17;
  --code-bg:#0a1110; --code-fg:#d6e4e0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --sunk:#1e2b29; --line:#2c3c39;
  --fg:#e3ece9; --muted:#97a8a3; --accent:#4fbcb6; --accent-ink:#06201f; --accent-soft:#16393a;
  --ok:#5cc27a; --warn:#e2a73a; --bad:#ef7b62; --ok-soft:#173523; --warn-soft:#3a2e12; --bad-soft:#3d1d17;
  --code-bg:#0a1110; --code-fg:#d6e4e0; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}

main{padding-block:16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.015em}
h2{font-size:21px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.lede{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* list rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:700;min-width:0}
.item .s{font-size:13px;color:var(--muted)}
.mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.mark.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mark.peek{border-color:var(--warn);color:var(--warn)}
.lv{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}

/* editor */
.prompt{font-size:17px}
.kbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.kbar::-webkit-scrollbar{display:none}
.kbar button{flex:none;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 8px}
textarea.code{width:100%;min-height:190px;resize:vertical;font-family:var(--mono);font-size:16px;line-height:1.45;background:var(--code-bg);color:var(--code-fg);
  border:1px solid var(--line);border-radius:10px;padding:12px;tab-size:2;box-sizing:border-box}
pre.code{margin:0;font-family:var(--mono);font-size:13px;line-height:1.5;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre}
.result{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:320px;overflow-y:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);font-weight:700}
td.num{text-align:right}
td.null{color:var(--muted);font-style:italic}
.note{border-radius:10px;padding:10px 12px;font-size:15px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--fg)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{font-weight:700;cursor:pointer}
details > *:not(summary){margin-top:8px}

/* flashcards */
.flash{min-height:180px;justify-content:center}
.flash .q{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.25}
.flash .a{border-top:1px dashed var(--line);padding-top:12px}

/* interview */
.qcard .q{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.beats{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.dial{display:grid;place-items:center;position:relative;margin:4px auto 0;width:min(260px,72vw);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;display:block}
.dial .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .time{font-family:var(--mono);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dial .phase{font-weight:700;font-size:14px}
.ring-track{stroke:var(--sunk)}
.ring-tick{stroke:var(--muted)}
.ring-fill{transition:stroke .3s}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:700;min-height:44px}
.rate button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
input.text{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}

/* quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px;min-height:48px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.metric{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px}
.metric em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in"><div class="brand">Prep<span>Deck</span></div><div class="sync" id="sync">Saved on this device</div></div></header>
<main><div class="wrap" id="view"></div></main>

  <a href="#interview" data-tab="interview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Interview</a>
  <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Quiz</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
</div></nav>

<script>
// ---------- Practice database (Chipply-style marketplace) ----------
function buildPracticeSQL(){
  let s = 20260917;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const pad = n => String(n).padStart(2, '0');
  const q = v => v === null ? 'NULL' : (typeof v === 'number' ? v : "'" + String(v).replace(/'/g, "''") + "'");
  const ins = (t, rows) => rows.map(r => `INSERT INTO ${t} VALUES (${r.map(q).join(',')});`).join('\n');
  const addDays = (iso, d) => { const x = new Date(iso + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + d); return x.toISOString().slice(0, 10); };

  const dealers = [
    [1,'Badger Team Sports','WI','Gold'],[2,'Lakeshore Athletics','IL','Gold'],[3,'Prairie Spirit Wear','IA','Silver'],
    [4,'Gulf Coast Apparel','FL','Silver'],[5,'Mesa Uniform Co','AZ','Bronze'],[6,'Granite State Gear','NH','Silver'],
    [7,'Cascade Embroidery','OR','Bronze'],[8,'Tidewater Promo','VA','Bronze']
  ];
  const storeNames = ['Westside HS Booster','Oakwood Youth Soccer','Riverside Swim Club','St. Mark Parish','Lincoln Elem PTO',
    'Northfield Hockey','Summit Running Club','Bayview Lacrosse','Pinecrest Band','Eastgate Volleyball','Harbor Rowing',
    'Valley Wrestling','Maple Grove Softball','Canyon Climbing Gym','Hillcrest Robotics','Coastal Cheer','Ironwood Crossfit',
    'Meadow Lane Daycare','Desert Sun Pickleball','Old Mill Fire Dept'];
  const dealerRegion = {1:'Midwest',2:'Midwest',3:'Midwest',4:'South',5:'West',6:'Northeast',7:'West'};
  const storeDealer = [1,1,1,2,2,2,3,3,4,4,4,4,5,5,6,6,7,7,5,6];
  const stores = storeNames.map((n, i) => {
    const d = storeDealer[i];
    return [i + 1, n, d, dealerRegion[d], '2025-' + pad(1 + (i % 6)) + '-' + pad(3 + i)];
  });

  const first = ['ana','ben','cara','dev','eli','fay','gus','hana','ivan','jo','kai','lena','mo','nia','omar','pia','quinn','rui','sam','tess'];
  const last = ['silva','moore','khan','lee','ortiz','berg','nash','reyes','park','cole','dunn','frost'];
  const customers = []; const seen = new Set();
  while (customers.length < 60) {
    const e = pick(first) + '.' + pick(last) + '@mail.com';
    if (seen.has(e)) continue; seen.add(e);
    const d = addDays('2025-06-01', Math.floor(rnd() * 300));
    customers.push([customers.length + 1, e, d, pick(['WI','IL','FL','AZ','OR','NH','IA'])]);
  }
  // duplicate sign-ups with different letter case, always later than the original
  [3, 11, 19, 27, 38, 52].forEach(i => {
    const c = customers[i - 1];
    customers.push([customers.length + 1, c[1].replace(/^./, ch => ch.toUpperCase()), addDays(c[2], 20 + i), c[3]]);
  });

  const orders = []; let oid = 1000;
  const storeWeight = stores.map((st, i) => i === 19 ? 0 : (i === 4 ? 1.1 : 0.6 + rnd() * 1.6));
  const tw = storeWeight.reduce((a, b) => a + b, 0);
  const pickStore = () => { let r = rnd() * tw; for (let i = 0; i < storeWeight.length; i++) { r -= storeWeight[i]; if (r <= 0) return i + 1; } return 1; };
  for (let k = 0; k < 420; k++) {
    let st = pickStore(); if (st === 20) st = 1;
    const c = customers[Math.floor(rnd() * 60)];
    let d = addDays('2025-07-01', Math.floor(rnd() * 365));
    if (d < c[2]) d = addDays(c[2], Math.floor(rnd() * 25));
    if (d > '2026-06-30') d = '2026-06-' + pad(10 + Math.floor(rnd() * 20));
    if (st === 5 && ['2025-09','2025-10','2026-01','2026-04'].includes(d.slice(0, 7))) st = 6;
    const r = rnd();
    const status = r < 0.8 ? 'completed' : (r < 0.88 ? 'refunded' : 'cancelled');
    const gmv = status === 'cancelled' ? null : Math.round((40 + rnd() * rnd() * 520) * 100) / 100;
    orders.push([oid++, st, c[0], d, status, gmv]);
  }

  const owners = ['Ana','Ben','Cara','Dev'];
  const deals = [];
  for (let k = 1; k <= 40; k++) {
    const created = addDays('2025-08-01', Math.floor(rnd() * 300));
    const r = rnd(); const ow = owners[k % 4];
    const winBias = { Ana: 0.15, Ben: 0, Cara: -0.12, Dev: 0.05 }[ow];
    const stage = r < 0.2 ? 'open' : (rnd() < 0.5 + winBias ? 'closedwon' : 'closedlost');
    deals.push([k, 1 + (k % 8), ow, stage, Math.round(2000 + rnd() * 18000), created, stage === 'open' ? null : addDays(created, 10 + Math.floor(rnd() * 60))]);
  }

  return `
CREATE TABLE dealers (dealer_id INTEGER PRIMARY KEY, dealer_name TEXT, state TEXT, tier TEXT);
CREATE TABLE stores (store_id INTEGER PRIMARY KEY, store_name TEXT, dealer_id INTEGER REFERENCES dealers(dealer_id), region TEXT, launched_on TEXT);
CREATE TABLE customers (customer_id INTEGER PRIMARY KEY, email TEXT, signup_date TEXT, state TEXT);
CREATE TABLE orders (order_id INTEGER PRIMARY KEY, store_id INTEGER REFERENCES stores(store_id), customer_id INTEGER REFERENCES customers(customer_id), order_date TEXT, status TEXT, gmv REAL);
CREATE TABLE deals (deal_id INTEGER PRIMARY KEY, dealer_id INTEGER REFERENCES dealers(dealer_id), owner TEXT, stage TEXT, amount REAL, created_on TEXT, closed_on TEXT);
${ins('dealers', dealers)}
${ins('stores', stores)}
${ins('customers', customers)}
${ins('orders', orders)}
${ins('deals', deals)}
`;
}

const SCHEMA_DOC = [
  ['dealers', 'dealer_id, dealer_name, state, tier', '8 dealers. Tidewater Promo has no stores.'],
  ['stores', 'store_id, store_name, dealer_id, region, launched_on', '20 team stores. Old Mill Fire Dept has no orders.'],
  ['customers', 'customer_id, email, signup_date, state', '66 rows. A few people signed up twice with different letter case.'],
  ['orders', 'order_id, store_id, customer_id, order_date, status, gmv', 'Jul 2025 to Jun 2026. status: completed, refunded, cancelled. Cancelled orders carry NULL gmv.'],
  ['deals', 'deal_id, dealer_id, owner, stage, amount, created_on, closed_on', 'HubSpot-style pipeline. stage: open, closedwon, closedlost.']
];

// ---------- Graded exercises ----------
const EXERCISES = [
  { id:'gmv-by-dealer', cat:'Joins & aggregation', level:1, ordered:true,
    title:'GMV by dealer',
    prompt:'Return each dealer_name and its total GMV from completed orders. Sort highest GMV first. Leave out dealers with no completed orders.',
    hint:'orders joins to stores on store_id, stores joins to dealers on dealer_id. Filter status in WHERE, then GROUP BY the dealer.',
    solution:`SELECT d.dealer_name,
       ROUND(SUM(o.gmv), 2) AS total_gmv
FROM orders o
JOIN stores s  ON s.store_id = o.store_id
JOIN dealers d ON d.dealer_id = s.dealer_id
WHERE o.status = 'completed'
GROUP BY d.dealer_name
ORDER BY total_gmv DESC;`,
    explain:'Inner joins drop anything without a match, which suits this ask. The WHERE filter runs before GROUP BY, so refunded and cancelled rows never reach the SUM.' },

  { id:'stores-no-orders', cat:'Joins & aggregation', level:1, ordered:false,
    title:'Stores with zero orders',
    prompt:'Return the store_name of every store that has never received an order of any status.',
    hint:'LEFT JOIN orders onto stores and keep the rows where the order side came back NULL. NOT EXISTS works too.',
    solution:`SELECT s.store_name
FROM stores s
LEFT JOIN orders o ON o.store_id = s.store_id
WHERE o.order_id IS NULL;`,
    explain:'This is the anti-join pattern. A LEFT JOIN keeps every store; stores with no match get NULLs in the order columns, and the WHERE keeps only those. Test a column that cannot be NULL on a real match, such as the primary key.' },

  { id:'dealer-store-count', cat:'Joins & aggregation', level:1, ordered:false,
    title:'Store count per dealer, zeros included',
    prompt:'Return every dealer_name with its number of stores. Dealers with no stores must show 0.',
    hint:'LEFT JOIN from dealers. Think about what COUNT(*) does on a row the LEFT JOIN padded with NULLs.',
    solution:`SELECT d.dealer_name,
       COUNT(s.store_id) AS store_count
FROM dealers d
LEFT JOIN stores s ON s.dealer_id = d.dealer_id
GROUP BY d.dealer_name;`,
    explain:'COUNT(*) counts the padded row and reports 1 for a dealer with no stores. COUNT(s.store_id) skips NULLs and reports 0. Interviewers love this trap.' },

  { id:'status-null-counts', cat:'Joins & aggregation', level:1, ordered:false,
    title:'COUNT(*) vs COUNT(column)',
    prompt:'For each order status, return status, the total number of orders, the number of orders with a non-NULL gmv, and the average gmv.',
    hint:'One GROUP BY status. Use COUNT(*), COUNT(gmv) and AVG(gmv) side by side.',
    solution:`SELECT status,
       COUNT(*)            AS orders,
       COUNT(gmv)          AS orders_with_gmv,
       ROUND(AVG(gmv), 2)  AS avg_gmv
FROM orders
GROUP BY status;`,
    explain:'Aggregates other than COUNT(*) ignore NULLs. The cancelled group shows a count but 0 rows with gmv and a NULL average. AVG divides by non-NULL rows, which can quietly inflate an average if you expected NULLs to count as zero.' },

  { id:'having-busy-stores', cat:'Joins & aggregation', level:2, ordered:true,
    title:'Busy stores with HAVING',
    prompt:'Return store_name, number of completed orders, and average completed order value for stores with at least 20 completed orders. Sort by order count, highest first.',
    hint:'WHERE filters rows before grouping. HAVING filters groups after aggregation.',
    solution:`SELECT s.store_name,
       COUNT(*)              AS completed_orders,
       ROUND(AVG(o.gmv), 2)  AS avg_order_value
FROM orders o
JOIN stores s ON s.store_id = o.store_id
WHERE o.status = 'completed'
GROUP BY s.store_name
HAVING COUNT(*) >= 20
ORDER BY completed_orders DESC;`,
    explain:'You cannot reference COUNT(*) in WHERE because WHERE runs before grouping. Logical order: FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.' },

  { id:'monthly-region', cat:'Joins & aggregation', level:2, ordered:true,
    title:'Monthly GMV by region',
    prompt:'Return month (YYYY-MM), region, and completed GMV. Sort by month, then region.',
    hint:"SQLite: strftime('%Y-%m', order_date) or substr(order_date, 1, 7). Postgres would use date_trunc or to_char.",
    solution:`SELECT strftime('%Y-%m', o.order_date) AS month,
       s.region,
       ROUND(SUM(o.gmv), 2) AS gmv
FROM orders o
JOIN stores s ON s.store_id = o.store_id
WHERE o.status = 'completed'
GROUP BY month, s.region
ORDER BY month, s.region;`,
    explain:'Group by every non-aggregated column in SELECT. SQLite and Postgres both let you GROUP BY a SELECT alias; SQL Server does not, so there you repeat the expression.' },

  { id:'rank-in-region', cat:'Window functions', level:2, ordered:false,
    title:'Rank stores inside each region',
    prompt:'Return region, store_name, completed GMV, and a dense rank of that GMV within the region (1 = highest). Include only stores with completed orders.',
    hint:'Aggregate first (CTE or subquery), then apply DENSE_RANK() OVER (PARTITION BY region ORDER BY gmv DESC).',
    solution:`WITH store_gmv AS (
  SELECT s.region, s.store_name, SUM(o.gmv) AS gmv
  FROM orders o
  JOIN stores s ON s.store_id = o.store_id
  WHERE o.status = 'completed'
  GROUP BY s.region, s.store_name
)
SELECT region, store_name, ROUND(gmv, 2) AS gmv,
       DENSE_RANK() OVER (PARTITION BY region ORDER BY gmv DESC) AS region_rank
FROM store_gmv;`,
    explain:'PARTITION BY restarts the ranking for each region. You can also nest the window over an aggregate in one SELECT: DENSE_RANK() OVER (PARTITION BY region ORDER BY SUM(gmv) DESC), since windows run after GROUP BY.' },

  { id:'top2-per-region', cat:'Window functions', level:2, ordered:false,
    title:'Top 2 stores per region',
    prompt:'Return region, store_name and completed GMV for the two highest-GMV stores in each region.',
    hint:'Number rows with ROW_NUMBER() inside a CTE, then filter on that number in the outer query. You cannot filter a window function in WHERE.',
    solution:`WITH store_gmv AS (
  SELECT s.region, s.store_name, SUM(o.gmv) AS gmv
  FROM orders o
  JOIN stores s ON s.store_id = o.store_id
  WHERE o.status = 'completed'
  GROUP BY s.region, s.store_name
), ranked AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY region ORDER BY gmv DESC) AS rn
  FROM store_gmv
)
SELECT region, store_name, ROUND(gmv, 2) AS gmv
FROM ranked
WHERE rn <= 2;`,
    explain:'Top-N per group is the most asked window question. ROW_NUMBER gives exactly N rows; RANK or DENSE_RANK can return more when values tie. Say which one you picked and why.' },

  { id:'running-total', cat:'Window functions', level:2, ordered:true,
    title:'Running total by month',
    prompt:'Return month (YYYY-MM), completed GMV for that month, and the cumulative GMV through that month. Sort by month.',
    hint:'Aggregate to one row per month first, then SUM(gmv) OVER (ORDER BY month).',
    solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', order_date) AS month, SUM(gmv) AS gmv
  FROM orders
  WHERE status = 'completed'
  GROUP BY month
)
SELECT month,
       ROUND(gmv, 2) AS gmv,
       ROUND(SUM(gmv) OVER (ORDER BY month
             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW), 2) AS running_gmv
FROM monthly
ORDER BY month;`,
    explain:'With ORDER BY and no frame, the default frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. RANGE treats tied ORDER BY values as one peer group, so duplicate dates jump together. ROWS counts physical rows. Name the frame when it matters.' },

  { id:'mom-change', cat:'Window functions', level:2, ordered:true,
    title:'Month-over-month change with LAG',
    prompt:'Return month, completed GMV, the previous month GMV, and the dollar change from the previous month. The first month shows NULL for the last two columns.',
    hint:'LAG(gmv) OVER (ORDER BY month) reads the prior row.',
    solution:`WITH monthly AS (
  SELECT strftime('%Y-%m', order_date) AS month, SUM(gmv) AS gmv
  FROM orders
  WHERE status = 'completed'
  GROUP BY month
)
SELECT month,
       ROUND(gmv, 2) AS gmv,
       ROUND(LAG(gmv) OVER (ORDER BY month), 2) AS prev_gmv,
       ROUND(gmv - LAG(gmv) OVER (ORDER BY month), 2) AS change
FROM monthly
ORDER BY month;`,
    explain:'LAG looks back, LEAD looks ahead. Both take an offset and a default: LAG(gmv, 1, 0). For percent change, divide by NULLIF(prev, 0) so a zero month does not throw a divide-by-zero.' },

  { id:'days-to-second', cat:'Window functions', level:3, ordered:false,
    title:'Days from first to second order',
    prompt:'For every customer with at least two orders (any status), return customer_id, first order date, second order date, and the whole number of days between them. Break same-day ties by order_id.',
    hint:'ROW_NUMBER() per customer ordered by order_date, order_id. Then either self-join rn = 1 to rn = 2, or use LEAD in the same step and keep rn = 1.',
    solution:`WITH seq AS (
  SELECT customer_id, order_date,
         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS rn,
         LEAD(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS next_date
  FROM orders
)
SELECT customer_id,
       order_date AS first_order,
       next_date  AS second_order,
       CAST(julianday(next_date) - julianday(order_date) AS INTEGER) AS days_between
FROM seq
WHERE rn = 1 AND next_date IS NOT NULL;`,
    explain:'Time-to-second-purchase is a classic retention metric. The tie-breaker keeps the result deterministic. Date math differs by engine: julianday in SQLite, date subtraction in Postgres, DATEDIFF in SQL Server.' },

  { id:'share-of-region', cat:'Window functions', level:3, ordered:false,
    title:'Share of region GMV',
    prompt:'Return region, store_name, completed GMV, and that store share of its region total as a percent rounded to 1 decimal.',
    hint:'A window SUM with PARTITION BY region and no ORDER BY gives the region total on every row.',
    solution:`WITH store_gmv AS (
  SELECT s.region, s.store_name, SUM(o.gmv) AS gmv
  FROM orders o
  JOIN stores s ON s.store_id = o.store_id
  WHERE o.status = 'completed'
  GROUP BY s.region, s.store_name
)
SELECT region, store_name, ROUND(gmv, 2) AS gmv,
       ROUND(100.0 * gmv / SUM(gmv) OVER (PARTITION BY region), 1) AS pct_of_region
FROM store_gmv;`,
    explain:'A window aggregate keeps every row, unlike GROUP BY. Multiply by 100.0, not 100, so integer columns do not trigger integer division in engines that truncate.' },

  { id:'dedupe-customers', cat:'CTEs & subqueries', level:2, ordered:false,
    title:'Deduplicate customers',
    prompt:'Some people signed up twice with emails that differ only in letter case. Return customer_id and signup_date of the earliest sign-up for each distinct email, one row per person.',
    hint:'ROW_NUMBER() OVER (PARTITION BY LOWER(email) ORDER BY signup_date) inside a CTE, keep rn = 1.',
    solution:`WITH ranked AS (
  SELECT customer_id, signup_date,
         ROW_NUMBER() OVER (PARTITION BY LOWER(email)
                            ORDER BY signup_date, customer_id) AS rn
  FROM customers
)
SELECT customer_id, signup_date
FROM ranked
WHERE rn = 1;`,
    explain:'The dedupe pattern: partition by the natural key, order by the rule that picks the survivor, keep row 1. Normalize the key (LOWER, TRIM) before partitioning.' },

  { id:'beat-region-avg', cat:'CTEs & subqueries', level:2, ordered:false,
    title:'Stores above their region average',
    prompt:'Return store_name and region for stores whose completed GMV beats the average completed GMV of stores in the same region.',
    hint:'Build store totals in a CTE. Then compare each row with AVG(gmv) for its region, through a correlated subquery or a window AVG.',
    solution:`WITH store_gmv AS (
  SELECT s.store_name, s.region, SUM(o.gmv) AS gmv
  FROM orders o
  JOIN stores s ON s.store_id = o.store_id
  WHERE o.status = 'completed'
  GROUP BY s.store_name, s.region
)
SELECT store_name, region
FROM store_gmv a
WHERE gmv > (SELECT AVG(b.gmv) FROM store_gmv b WHERE b.region = a.region);`,
    explain:'A correlated subquery references the outer row (a.region) and re-runs per row. Many engines rewrite it as a join, but the window version, AVG(gmv) OVER (PARTITION BY region), reads the data once and scales better.' },

  { id:'cohort-repeat', cat:'CTEs & subqueries', level:3, ordered:true,
    title:'Signup cohort repeat rate',
    prompt:'Using the raw customers table, return signup month (YYYY-MM), customers who signed up that month, and how many of them placed 2 or more completed orders. Sort by month.',
    hint:'Count completed orders per customer in a CTE. LEFT JOIN it to customers so people with zero orders still count in the denominator.',
    solution:`WITH per_customer AS (
  SELECT customer_id, COUNT(*) AS completed
  FROM orders
  WHERE status = 'completed'
  GROUP BY customer_id
)
SELECT strftime('%Y-%m', c.signup_date) AS signup_month,
       COUNT(*) AS signed_up,
       SUM(CASE WHEN p.completed >= 2 THEN 1 ELSE 0 END) AS repeaters
FROM customers c
LEFT JOIN per_customer p ON p.customer_id = c.customer_id
GROUP BY signup_month
ORDER BY signup_month;`,
    explain:'Conditional aggregation, SUM(CASE WHEN ... THEN 1 ELSE 0 END), counts a subset inside one GROUP BY. Pre-aggregating before the join prevents fan-out, where a one-to-many join multiplies rows and inflates sums.' },

  { id:'calendar-fill', cat:'CTEs & subqueries', level:3, ordered:true,
    title:'Fill missing months with a recursive CTE',
    prompt:'Return every month from 2025-07 through 2026-06 with completed GMV for store_id 5 (Lincoln Elem PTO). Months with no sales must show 0.',
    hint:"A recursive CTE: anchor row date('2025-07-01'), recursive step date(m, '+1 month') until 2026-06-01. LEFT JOIN the store's monthly totals and COALESCE to 0.",
    solution:`WITH RECURSIVE months(m) AS (
  SELECT date('2025-07-01')
  UNION ALL
  SELECT date(m, '+1 month') FROM months WHERE m < '2026-06-01'
), store5 AS (
  SELECT strftime('%Y-%m', order_date) AS month, SUM(gmv) AS gmv
  FROM orders
  WHERE store_id = 5 AND status = 'completed'
  GROUP BY month
)
SELECT strftime('%Y-%m', months.m) AS month,
       ROUND(COALESCE(store5.gmv, 0), 2) AS gmv
FROM months
LEFT JOIN store5 ON store5.month = strftime('%Y-%m', months.m)
ORDER BY month;`,
    explain:'A recursive CTE has an anchor member, UNION ALL, and a recursive member with a stop condition. Postgres users often reach for generate_series instead. Gap-filling keeps line charts and averages honest.' },

  { id:'win-rate', cat:'CTEs & subqueries', level:2, ordered:false,
    title:'Pipeline win rate by owner',
    prompt:'From deals, return owner, closed-won count, closed-lost count, and win rate as a percent rounded to 1 decimal. Exclude open deals from the rate.',
    hint:'Conditional aggregation again. Win rate = won / (won + lost).',
    solution:`SELECT owner,
       SUM(CASE WHEN stage = 'closedwon'  THEN 1 ELSE 0 END) AS won,
       SUM(CASE WHEN stage = 'closedlost' THEN 1 ELSE 0 END) AS lost,
       ROUND(100.0 * SUM(CASE WHEN stage = 'closedwon' THEN 1 ELSE 0 END)
             / NULLIF(SUM(CASE WHEN stage IN ('closedwon','closedlost') THEN 1 ELSE 0 END), 0), 1) AS win_rate_pct
FROM deals
GROUP BY owner;`,
    explain:'You built this exact metric in HubSpot at Chipply, so expect follow-ups: should open deals count, how do you treat deals that reopen, and over what window do you measure.' },

  { id:'second-highest', cat:'CTEs & subqueries', level:2, ordered:false,
    title:'Second-highest dealer',
    prompt:'Return the dealer_name with the second-highest completed GMV.',
    hint:'DENSE_RANK in a CTE and keep rank 2, or ORDER BY ... LIMIT 1 OFFSET 1.',
    solution:`WITH dealer_gmv AS (
  SELECT d.dealer_name, SUM(o.gmv) AS gmv
  FROM orders o
  JOIN stores s  ON s.store_id = o.store_id
  JOIN dealers d ON d.dealer_id = s.dealer_id
  WHERE o.status = 'completed'
  GROUP BY d.dealer_name
), ranked AS (
  SELECT dealer_name, DENSE_RANK() OVER (ORDER BY gmv DESC) AS rk
  FROM dealer_gmv
)
SELECT dealer_name FROM ranked WHERE rk = 2;`,
    explain:'LIMIT/OFFSET breaks on ties. DENSE_RANK returns every dealer tied for second. Mention the tie case out loud in an interview; it shows you think about edge cases.' }
];

// ---------- Concept flashcards ----------
const SQL_CARDS = [
  // Joins & aggregation
  {cat:'Joins & aggregation', q:'In what order does a SELECT statement logically run?', a:'FROM and JOINs, WHERE, GROUP BY, HAVING, SELECT (window functions run here), DISTINCT, ORDER BY, LIMIT/OFFSET. That order explains why WHERE cannot see a SELECT alias or an aggregate, and ORDER BY can.'},
  {cat:'Joins & aggregation', q:'INNER vs LEFT vs FULL OUTER join?', a:'INNER keeps rows that match on both sides. LEFT keeps every left row and fills NULLs where the right side has no match. FULL OUTER keeps unmatched rows from both sides. CROSS JOIN returns every combination.'},
  {cat:'Joins & aggregation', q:'Why does a WHERE filter on the right table break a LEFT JOIN?', a:'Unmatched rows carry NULL in right-table columns, and WHERE right.col = \'x\' throws those rows out, so the query behaves like an INNER JOIN. Move the condition into the ON clause to filter the right side and keep every left row.', code:"SELECT s.store_name, o.order_id\nFROM stores s\nLEFT JOIN orders o\n  ON o.store_id = s.store_id\n AND o.status = 'completed';"},
  {cat:'Joins & aggregation', q:'COUNT(*) vs COUNT(col) vs COUNT(DISTINCT col)?', a:'COUNT(*) counts rows. COUNT(col) counts non-NULL values in col. COUNT(DISTINCT col) counts unique non-NULL values. After a LEFT JOIN, count a column from the right table to get 0 for no matches.'},
  {cat:'Joins & aggregation', q:'WHERE vs HAVING?', a:'WHERE filters individual rows before grouping and cannot use aggregates. HAVING filters groups after aggregation. Put row-level filters in WHERE: the engine aggregates fewer rows.'},
  {cat:'Joins & aggregation', q:'How do NULLs behave in comparisons?', a:'Any comparison with NULL returns UNKNOWN, so col = NULL never matches. Use IS NULL / IS NOT NULL. NOT IN against a list that contains a NULL returns no rows at all; use NOT EXISTS instead.'},
  {cat:'Joins & aggregation', q:'What is join fan-out and how do you prevent it?', a:'A one-to-many join repeats the "one" side for every match, so summing a column from that side multiplies it. Aggregate each side to the grain you need before joining, or check row counts before and after each join.'},
  {cat:'Joins & aggregation', q:'UNION vs UNION ALL?', a:'UNION removes duplicate rows, which costs a sort or hash. UNION ALL keeps every row and runs faster. Use UNION ALL unless you need deduplication.'},
  {cat:'Joins & aggregation', q:'What is conditional aggregation?', a:'A CASE expression inside an aggregate counts or sums a subset within one GROUP BY. It pivots rows into columns without extra joins.', code:"SUM(CASE WHEN status = 'refunded' THEN gmv ELSE 0 END) AS refunded_gmv"},
  {cat:'Joins & aggregation', q:'When would you use a self join?', a:'When a table relates to itself: employee to manager, an order to the same customer\'s previous order, comparing two dates for one entity. Alias the table twice and join on the relationship.'},
  // Window functions
  {cat:'Window functions', q:'Window function vs GROUP BY?', a:'GROUP BY collapses rows into one per group. A window function computes across a set of related rows and keeps every row. Use windows for rankings, running totals, and comparing a row to its group.'},
  {cat:'Window functions', q:'ROW_NUMBER vs RANK vs DENSE_RANK on values 100, 90, 90, 80?', a:'ROW_NUMBER: 1, 2, 3, 4 (ties broken arbitrarily). RANK: 1, 2, 2, 4 (skips after a tie). DENSE_RANK: 1, 2, 2, 3 (no gaps).'},
  {cat:'Window functions', q:'What do PARTITION BY and ORDER BY do inside OVER()?', a:'PARTITION BY splits rows into independent groups and restarts the calculation for each. ORDER BY sets row order inside each partition, and for aggregates it also turns on a running frame.'},
  {cat:'Window functions', q:'ROWS vs RANGE frames?', a:'ROWS counts physical rows (ROWS BETWEEN 6 PRECEDING AND CURRENT ROW gives a 7-row moving window). RANGE groups rows with equal ORDER BY values as peers. The default frame with ORDER BY is RANGE UNBOUNDED PRECEDING to CURRENT ROW, which makes tied dates jump together in a running total.'},
  {cat:'Window functions', q:'Why can\'t you put a window function in WHERE?', a:'Window functions run during SELECT, after WHERE, GROUP BY and HAVING. Compute it in a CTE or subquery and filter in the outer query. Snowflake, BigQuery and Databricks add QUALIFY for this.', code:'WITH r AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY region ORDER BY gmv DESC) rn\n  FROM store_gmv)\nSELECT * FROM r WHERE rn <= 3;'},
  {cat:'Window functions', q:'What do LAG and LEAD do?', a:'LAG(col, n, default) reads the value n rows before the current row in the window order. LEAD reads n rows after. Use them for period-over-period change, time between events, and next-step funnels.'},
  {cat:'Window functions', q:'What is the LAST_VALUE gotcha?', a:'With ORDER BY and the default frame, the frame ends at the current row, so LAST_VALUE returns the current row. Add ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, or use FIRST_VALUE with the order reversed.'},
  {cat:'Window functions', q:'What does NTILE(4) do?', a:'It splits ordered rows into 4 buckets of near-equal size and returns the bucket number. Use it for quartiles or deciles, such as segmenting dealers by GMV.'},
  {cat:'Window functions', q:'How do you compute a 7-day moving average?', a:'Aggregate to one row per day first (fill missing days), then AVG(value) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW).'},
  // CTEs & subqueries
  {cat:'CTEs & subqueries', q:'CTE vs subquery vs temp table?', a:'A CTE names a query step for readability and runs inside one statement. A subquery does the same inline. A temp table stores results physically for reuse across statements and can carry indexes. Most engines optimize CTEs and subqueries the same way.'},
  {cat:'CTEs & subqueries', q:'What is a correlated subquery?', a:'A subquery that references a column from the outer query, so it logically runs once per outer row. Example: WHERE gmv > (SELECT AVG(gmv) FROM t b WHERE b.region = a.region). A window function or join often runs faster.'},
  {cat:'CTEs & subqueries', q:'EXISTS vs IN?', a:'EXISTS stops at the first match and handles NULLs safely. IN compares against a list; NOT IN returns nothing if the list holds a NULL. Modern optimizers often run IN and EXISTS the same way, but NOT EXISTS is the safe anti-join.'},
  {cat:'CTEs & subqueries', q:'What are the parts of a recursive CTE?', a:'An anchor query that returns the starting rows, UNION ALL, and a recursive query that references the CTE itself with a stop condition. Uses: date spines, org charts, bill-of-materials hierarchies.'},
  {cat:'CTEs & subqueries', q:'How do you remove duplicates and keep one row per key?', a:'ROW_NUMBER() OVER (PARTITION BY key ORDER BY rule) in a CTE, then keep rn = 1. The ORDER BY decides the survivor: earliest, latest, most complete.'},
  // Performance & theory
  {cat:'Performance & theory', q:'What is an index and when does it hurt?', a:'An index is a sorted structure (usually a B-tree) that lets the engine find rows without scanning the table. It speeds reads on filtered, joined or sorted columns. It slows inserts and updates, takes storage, and helps little on low-cardinality columns or queries that read most of the table.'},
  {cat:'Performance & theory', q:'What makes a predicate sargable?', a:'The engine can use an index when the column stands alone. WHERE YEAR(order_date) = 2026 wraps the column in a function and forces a scan. Rewrite as WHERE order_date >= \'2026-01-01\' AND order_date < \'2027-01-01\'. Leading wildcards (LIKE \'%x\') also block index use.'},
  {cat:'Performance & theory', q:'Composite index (a, b): which queries use it?', a:'Queries filtering on a, or on a and b. A filter on b alone usually cannot seek with it. Put the most selective equality column first and range columns last.'},
  {cat:'Performance & theory', q:'How do you read an execution plan?', a:'Run EXPLAIN (EXPLAIN ANALYZE in Postgres for actual timings). Look for full scans on big tables, estimated vs actual row gaps, expensive sorts, and nested loops over large inputs. Then add an index, rewrite the predicate, pre-aggregate, or update statistics. In this app\'s sandbox, try EXPLAIN QUERY PLAN.'},
  {cat:'Performance & theory', q:'Clustered vs nonclustered index?', a:'A clustered index sets the physical row order of the table; a table has only one (SQL Server uses the primary key by default). A nonclustered index is a separate structure pointing back to rows; a table can have many.'},
  {cat:'Performance & theory', q:'Explain 1NF, 2NF and 3NF in one breath.', a:'1NF: atomic values, no repeating groups. 2NF: every non-key column depends on the whole key. 3NF: no non-key column depends on another non-key column. Normalize OLTP systems to avoid update anomalies; denormalize analytics models for fast reads.'},
  {cat:'Performance & theory', q:'OLTP vs OLAP?', a:'OLTP serves many small reads and writes (orders, payments), normalized, row-oriented. OLAP serves large scans and aggregations for analytics, usually columnar, with star schemas. Your Postgres warehouse at Chipply sat on the OLAP side.'},
  {cat:'Performance & theory', q:'What does ACID mean?', a:'Atomicity: a transaction applies fully or not at all. Consistency: it moves the database between valid states. Isolation: concurrent transactions do not see each other\'s partial work. Durability: committed data survives a crash.'},
  {cat:'Performance & theory', q:'View vs materialized view?', a:'A view stores the query and runs it every time you read it. A materialized view stores the results and needs a refresh. Use materialized views for expensive aggregates that tolerate some staleness.'},
  {cat:'Performance & theory', q:'DELETE vs TRUNCATE vs DROP?', a:'DELETE removes chosen rows, logs each one, fires triggers, and can roll back. TRUNCATE empties the whole table fast with minimal logging. DROP removes the table and its definition.'},
  {cat:'Performance & theory', q:'Primary key vs foreign key vs unique constraint?', a:'A primary key identifies each row: unique and not NULL, one per table. A foreign key references a primary key in another table and enforces that the parent exists. A unique constraint blocks duplicates but can allow NULL.'},
  {cat:'Performance & theory', q:'How would you speed up a slow dashboard query?', a:'Check the plan first. Then filter early, select only needed columns, pre-aggregate to the reporting grain, index join and filter columns, replace correlated subqueries with joins or windows, and materialize heavy logic in the warehouse instead of the report.'}
];

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

// ---------- state + persistence ----------
const KEY = 'prepdeck-v1';
const blank = () => ({v:1, sqlSolved:{}, sqlPeek:{}, cards:{}, attempts:[], quiz:{}, misses:{}, days:{}, drafts:{}, updatedAt:0});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
let remoteRef = null, saveTimer = null, writing = false, pendingWrite = false;
function touch(){ S.days[today()] = true; S.updatedAt = Date.now(); scheduleSave(); }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 900); }
async function saveNow(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (!remoteRef) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try { await remoteRef.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); setSync('Synced to your account'); }

let SQLdb = null, engineState = 'idle', engineWaiters = [];
function loadEngine(){
  if (engineState !== 'idle') return;

  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js';
  s.onload = () => initSqlJs().then(SQL => { SQLdb = new SQL.Database(); SQLdb.exec(buildPracticeSQL()); engineState = 'ready'; engineWaiters.splice(0).forEach(f => f()); })

  s.onerror = () => { engineState = 'failed'; engineWaiters.splice(0).forEach(f => f()); };
  document.head.appendChild(s);
}
function whenEngine(fn){ if (engineState === 'ready' || engineState === 'failed') fn(); else { engineWaiters.push(fn); loadEngine(); } }
function runSQL(sql){
  const res = SQLdb.exec(sql);

function tableHTML(r){
  if (!r.columns.length) return '<p class="note info">Query ran. No rows returned.</p>';
  const head = '<tr>' + r.columns.map(c => '<th>'+esc(c)+'</th>').join('') + '</tr>';
  const body = r.values.slice(0, 200).map(row => '<tr>' + row.map(v => v === null ? '<td class="null">NULL</td>' : (typeof v === 'number' ? '<td class="num">'+esc(Number.isInteger(v) ? v : Math.round(v*100)/100)+'</td>' : '<td>'+esc(v)+'</td>')).join('') + '</tr>').join('');
  return '<div class="result"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div><p class="small muted">'+r.values.length+' row'+(r.values.length===1?'':'s')+(r.values.length>200?', showing 200':'')+'</p>';
}
function sameVal(a, b){
  if (a === null || b === null) return a === b;
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 0.06;
  if (typeof a === 'number' || typeof b === 'number') return String(a) === String(b) || Math.abs(Number(a) - Number(b)) < 0.06;

}
const rowKey = r => r.map(v => v === null ? '~' : (typeof v === 'number' ? 'n' + Math.round(v) : 's' + v)).join('|');
function compare(got, want, ordered){
  if (got.columns.length !== want.columns.length) return {ok:false, msg:'You returned ' + got.columns.length + ' column' + (got.columns.length===1?'':'s') + '. The task expects ' + want.columns.length + '.'};
  if (got.values.length !== want.values.length) return {ok:false, msg:'You returned ' + got.values.length + ' rows. The task expects ' + want.values.length + '.'};
  const eqRows = (A, B) => A.every((r, i) => r.every((v, j) => sameVal(v, B[i][j])));
  if (ordered) {
    if (eqRows(got.values, want.values)) return {ok:true};
    const gs = [...got.values].sort((a,b) => rowKey(a) < rowKey(b) ? -1 : 1), ws = [...want.values].sort((a,b) => rowKey(a) < rowKey(b) ? -1 : 1);
    if (eqRows(gs, ws)) return {ok:false, msg:'Your rows match, but the order does not. Check ORDER BY.'};
    return {ok:false, msg:'Row count matches, but some values differ. Check filters, joins and column order.'};
  }
  const gs = [...got.values].sort((a,b) => rowKey(a) < rowKey(b) ? -1 : 1), ws = [...want.values].sort((a,b) => rowKey(a) < rowKey(b) ? -1 : 1);
  if (eqRows(gs, ws)) return {ok:true};
  return {ok:false, msg:'Row count matches, but some values differ. Check filters, joins and column order.'};
}

  }
  const nMiss = Object.keys(S.misses).length;
  h += '<div class="row"><button class="btn primary" data-act="quiz-start" data-v="mixed">Mixed 10</button><button class="btn" data-act="quiz-start" data-v="misses"'+(nMiss?'':' disabled')+'>Retry misses ('+nMiss+')</button></div>';
  h += '<div class="list">' + QUIZ_TOPICS.map(t => {
    const s = S.quiz[t] || {c:0, n:0};
    const pct = s.n ? Math.round(100 * s.c / s.n) : null;
    return '<button class="item" data-act="quiz-start" data-v="'+esc(t)+'"><span class="mark'+(pct!==null&&pct>=80?' done':'')+'">'+(pct!==null&&pct>=80?'✓':'')+'</span><span><span class="t">'+esc(t)+'</span><br><span class="s">'+QUIZ[t].length+' questions'+(s.n?' · '+s.n+' answered':'')+'</span></span><span class="pill'+(pct===null?'':pct>=80?' ok':pct>=60?' warn':' bad')+'">'+(pct===null?'New':pct+'%')+'</span></button>';
  }).join('') + '</div>';
  v.innerHTML = h;
}

// ---------- Progress ----------
function streak(){
  let n = 0; const d = new Date();
  if (!S.days[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if (!S.days[k]) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderProgress(){
  const solved = Object.keys(S.sqlSolved).length;
  const known = Object.keys(S.cards).filter(k => S.cards[k]).length;
  const att = S.attempts;
  const recent = att.slice(-20);
  const avg = recent.length ? recent.reduce((a, b) => a + b.t, 0) / recent.length : 0;
  const under = recent.length ? Math.round(100 * recent.filter(a => a.t <= LIMIT).length / recent.length) : 0;
  let qc = 0, qn = 0; Object.values(S.quiz).forEach(s => { qc += s.c; qn += s.n; });
  let h = '<div><p class="eyebrow">Progress</p><h1>Where you stand</h1></div>';
  h += '<div class="stats">'
    + '<div class="stat"><b>'+streak()+'</b><span>day practice streak</span></div>'
    + '<div class="stat"><b>'+solved+'/'+EXERCISES.length+'</b><span>SQL exercises solved</span></div>'
    + '<div class="stat"><b>'+att.length+'</b><span>timed answers recorded</span></div>'
    + '<div class="stat"><b>'+(recent.length?fmt(avg):'–')+'</b><span>average answer, last 20</span></div>'
    + '<div class="stat"><b>'+(recent.length?under+'%':'–')+'</b><span>answers at 2:00 or less</span></div>'
    + '<div class="stat"><b>'+(qn?Math.round(100*qc/qn)+'%':'–')+'</b><span>quiz accuracy</span></div>'
    + '</div>';
  if (recent.length) {
    const max = Math.max(150, ...recent.map(a => a.t));
    const W = 320, H = 120, bw = W / 20;
    let svg = '<svg viewBox="0 0 '+W+' '+(H+18)+'" style="width:100%;height:auto" role="img" aria-label="Last '+recent.length+' answer lengths">';
    [[WARN_AT,'warn'],[LIMIT,'bad']].forEach(([s, c]) => { const y = H - H * s / max; svg += '<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--'+c+')" stroke-dasharray="4 4" stroke-width="1"/><text x="'+W+'" y="'+(y-3)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(s)+'</text>'; });
    recent.forEach((a, k) => { const bh = H * a.t / max; svg += '<rect x="'+(k*bw+2)+'" y="'+(H-bh)+'" width="'+(bw-4)+'" height="'+bh+'" rx="2" fill="var(--'+(a.t>LIMIT?'bad':a.t>WARN_AT?'warn':'ok')+')"/>'; });
    svg += '<text x="0" y="'+(H+14)+'" font-size="10" fill="var(--muted)">older</text><text x="'+W+'" y="'+(H+14)+'" font-size="10" text-anchor="end" fill="var(--muted)">latest</text></svg>';
    h += '<section class="panel"><h3>Answer length, last '+recent.length+'</h3>'+svg+'</section>';
    const byCat = {};
    att.forEach(a => { const c = QUESTIONS[a.q] && QUESTIONS[a.q].cat; if (!c) return; (byCat[c] = byCat[c] || []).push(a.t); });
    h += '<section class="panel"><h3>Average time by question type</h3>' + I_CATS.slice(1).map(c => { const arr = byCat[c] || []; const m = arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : 0; return '<div class="metric"><span>'+esc(c)+'</span><div class="bar"><i style="width:'+Math.min(100, 100*m/150)+'%;background:var(--'+(m>LIMIT?'bad':m>WARN_AT?'warn':'ok')+')"></i></div><em>'+(arr.length?fmt(m):'–')+'</em></div>'; }).join('') + '</section>';
  }
  h += '<section class="panel"><h3>Quiz by topic</h3>' + QUIZ_TOPICS.map(t => { const s = S.quiz[t] || {c:0,n:0}; const p = s.n ? Math.round(100*s.c/s.n) : 0; return '<div class="metric"><span>'+esc(t)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><em>'+(s.n?p+'%':'–')+'</em></div>'; }).join('') + '</section>';
  h += '<section class="panel"><h3>SQL flashcards</h3><div class="metric"><span>Marked known</span><div class="bar"><i style="width:'+(100*known/SQL_CARDS.length)+'%"></i></div><em>'+known+'/'+SQL_CARDS.length+'</em></div></section>';
  h += '<section class="panel"><p class="small muted">Progress saves to your account when you open this page signed in to Claude, so your phone and computer share it. Otherwise it stays in this browser.</p>';
  h += ui.resetAsk
    ? '<p class="note warn">Erase every attempt, score and solved mark?</p><div class="row"><button class="btn" data-act="reset-no">Keep my progress</button><button class="btn" style="color:var(--bad)" data-act="reset-yes">Erase all</button></div>'
    : '<div><button class="btn ghost" data-act="reset-ask">Reset progress…</button></div>';
  h += '</section>';
  $('#view').innerHTML = h;
}

// ---------- events ----------
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'sqlmode': ui.sqlMode = v; renderSQL(); break;
    case 'sqlcat': ui.sqlCat = v; renderSQL(); break;
    case 'open-ex': ui.ex = v; renderSQL(); window.scrollTo(0,0); break;
    case 'close-ex': ui.ex = null; renderSQL(); break;
    case 'ex-step': { const i = EXERCISES.findIndex(e => e.id === ui.ex) + Number(v); if (EXERCISES[i]) { ui.ex = EXERCISES[i].id; renderSQL(); window.scrollTo(0,0); } break; }
    case 'kb': insertAtCursor(v); break;
    case 'run': sqlAction('run'); break;
    case 'check': sqlAction('check'); break;
    case 'hint': { const e = EXERCISES.find(x => x.id === ui.ex); $('#fb').innerHTML = '<p class="note info">'+esc(e.hint)+'</p>'; break; }
    case 'show-sol': { const e = EXERCISES.find(x => x.id === ui.ex); if (!S.sqlSolved[e.id]) { S.sqlPeek[e.id] = true; touch(); }
      $('#extra').innerHTML = '<section class="panel"><h3>Reference solution</h3><pre class="code">'+esc(e.solution)+'</pre><p>'+esc(e.explain)+'</p><p class="small muted">Close this, wait a minute, and write it again from memory. It counts as solved when Check passes.</p></section>'; break; }
    case 'cardcat': ui.cardCat = v; ui.cardIdx = 0; ui.cardShow = false; renderSQL(); break;
    case 'card-show': ui.cardShow = true; renderSQL(); break;
    case 'card-step': ui.cardIdx++; ui.cardShow = false; renderSQL(); break;
    case 'card-mark': { const list = SQL_CARDS.map((c, i) => ({...c, i})).filter(c => ui.cardCat === 'All' || c.cat === ui.cardCat); const c = list[ui.cardIdx]; S.cards[c.i] = v === '1'; touch(); ui.cardIdx++; ui.cardShow = false; renderSQL(); break; }
    case 'icat': stopTimer(true); ui.iCat = v; ui.qIdx = 0; renderInterview(); break;
    case 'q-step': { stopTimer(true); const n = iList().length; ui.qIdx = (ui.qIdx + Number(v) + n) % n; renderInterview(); break; }
    case 'q-rand': { stopTimer(true); const n = iList().length; let k; do { k = Math.floor(Math.random() * n); } while (n > 1 && k === ui.qIdx); ui.qIdx = k; renderInterview(); break; }
    case 't-start': startTimer(true); break;
    case 't-now': startTimer(false); break;
    case 't-stop': stopTimer(false); break;
    case 'rate': T.rating = Number(v); document.querySelectorAll('.rate button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); break;
    case 't-save': { const q = iList()[ui.qIdx]; const note = ($('#tNote') || {}).value || '';
      S.attempts.push({q: q.i, t: Math.round(T.elapsed), r: T.rating, n: note.trim().slice(0, 120), d: Date.now()});
      if (S.attempts.length > 400) S.attempts = S.attempts.slice(-400);
      touch(); T.done = false; T.elapsed = 0; renderInterview(); break; }
    case 't-discard': T.done = false; T.elapsed = 0; $('#timerPanel').innerHTML = timerInnerHTML(); drawDial(); break;
    case 'quiz-start': startQuiz(v); break;
    case 'quiz-quit': ui.quiz = null; renderQuiz(); break;
    case 'pick': { const it = ui.quiz.items[ui.quiz.at]; if (it.picked !== null) break; it.picked = Number(v);
      const right = it.picked === it.ans; if (right) ui.quiz.score++;
      const s = S.quiz[it.t] || (S.quiz[it.t] = {c:0, n:0}); s.n++; if (right) s.c++;
      const key = it.t + '|' + it.i; if (right) delete S.misses[key]; else S.misses[key] = true;
      touch(); renderQuiz(); break; }
    case 'quiz-next': ui.quiz.at++; renderQuiz(); window.scrollTo(0,0); break;
    case 'reset-ask': ui.resetAsk = true; renderProgress(); break;
    case 'reset-no': ui.resetAsk = false; renderProgress(); break;
    case 'reset-yes': S = blank(); S.updatedAt = Date.now(); scheduleSave(); ui.resetAsk = false; renderProgress(); break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'ed' && (ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); sqlAction(ui.sqlMode === 'practice' ? 'check' : 'run'); }
  if (ev.target.id === 'ed' && ev.key === 'Tab') { ev.preventDefault(); const ta = ev.target, s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd); ta.setSelectionRange(s + 2, s + 2); ta.dispatchEvent(new Event('input')); }
});
if (!location.hash) history.replaceState(null, '', '#sql');
render();
})();
</script>
